name: Build and Push ML Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manually trigger the workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${{ secrets.DOCKER_USERNAME }}/mindmend-ml:${{ github.ref_name }},${{ secrets.DOCKER_USERNAME }}/mindmend-ml:latest" >> $GITHUB_ENV
          else
            echo "tags=${{ secrets.DOCKER_USERNAME }}/mindmend-ml:latest" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./ml_model
          push: true
          tags: ${{ env.tags }}

      - name: Run Docker container
        run: |
          docker run -d --name mindmend-ml-test ${{ secrets.DOCKER_USERNAME }}/mindmend-ml:latest

      - name: Wait for Docker container to start
        run: |
          sleep 30
          docker ps -a | grep mindmend-ml-test || exit 1

      - name: Stop and remove Docker container
        run: |
          docker stop mindmend-ml-test
          docker rm mindmend-ml-test

      - name: Log out from Docker Hub
        run: docker logout